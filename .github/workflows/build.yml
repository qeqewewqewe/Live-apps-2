name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Folder shajao
        run: |
          mkdir -p app/src/main/java/com/live/app app/src/main/res/layout
          mv app_build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.kt StreamService.kt app/src/main/java/com/live/app/
          mv activity_main.xml app/src/main/res/layout/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GameLive-APK
          path: app/build/outputs/apk/debug/app-debug.apk
